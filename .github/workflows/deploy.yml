# Publie la démo volley (branche dev de HandBase, réglée sur le volley, base Nextar-volley aux données fictives) sur GitHub Pages.
# Lancement à la main : onglet Actions → « Publier la démo » → Run workflow (ou gh workflow run).
name: Publier la démo

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branche de HandBase à publier
        default: dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: handbase-app/HandBase
          ref: ${{ inputs.ref || 'dev' }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /
          VITE_TRIAL: '1'
          VITE_DEMO: '1'
          # Volley : sport de l'installation (la base le dit aussi, hb_config) et nom de l'appli installée.
          VITE_SPORT: volley
          VITE_APP_NAME: Nextar Volley
          # Base Nextar-volley (données fictives) : jamais une base réelle.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
